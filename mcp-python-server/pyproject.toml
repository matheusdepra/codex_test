[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-python-server"
version = "0.1.0"
description = "Sample Model Context Protocol server exposing filesystem and command tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex Demo" }]
dependencies = [
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
